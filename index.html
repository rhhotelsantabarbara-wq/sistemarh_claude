    <script>
      // Load saved site title, favicon and description from localStorage
      (function() {
        const savedTitle = localStorage.getItem('siteTitle');
        if (savedTitle) {
          document.title = savedTitle;
        }
        
        const savedFavicon = localStorage.getItem('siteFavicon');
        if (savedFavicon) {
          let link = document.querySelector("link[rel~='icon']");
          if (!link) {
            link = document.createElement('link');
            link.rel = 'icon';
            document.head.appendChild(link);
          }
          link.href = savedFavicon;
        }
        
        const savedDescription = localStorage.getItem('siteDescription');
        if (savedDescription) {
          const metaDesc = document.querySelector('meta[name="description"]');
          const ogDesc = document.querySelector('meta[property="og:description"]');
          if (metaDesc) metaDesc.content = savedDescription;
          if (ogDesc) ogDesc.content = savedDescription;
        }
      })();
    </script>
