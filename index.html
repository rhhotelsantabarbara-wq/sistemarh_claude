<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cérebrum · RH Santa Bárbara</title>
    <meta name="description" content="Cérebrum, o sistema de RH do Hotel Fazenda Santa Bárbara." />
    <meta name="author" content="Hotel Fazenda Santa Bárbara" />
    <meta name="theme-color" content="#2F54EB" />

    <meta property="og:title" content="Cérebrum · RH Santa Bárbara" />
    <meta property="og:description" content="Sistema de RH do Hotel Fazenda Santa Bárbara." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rhsantabarbara.com.br/" />
    <meta property="og:image" content="https://rhsantabarbara.com.br/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rhsantabarbara.com.br/og-image.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <script>
      // Load saved site title, favicon and description from localStorage
      (function() {
        const savedTitle = localStorage.getItem('siteTitle');
        if (savedTitle) {
          document.title = savedTitle;
        }
        
        const savedFavicon = localStorage.getItem('siteFavicon');
        if (savedFavicon) {
          let link = document.querySelector("link[rel~='icon']");
          if (!link) {
            link = document.createElement('link');
            link.rel = 'icon';
            document.head.appendChild(link);
          }
          link.href = savedFavicon;
        }
        
        const savedDescription = localStorage.getItem('siteDescription');
        if (savedDescription) {
          const metaDesc = document.querySelector('meta[name="description"]');
          const ogDesc = document.querySelector('meta[property="og:description"]');
          if (metaDesc) metaDesc.content = savedDescription;
          if (ogDesc) ogDesc.content = savedDescription;
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
